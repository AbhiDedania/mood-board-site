<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Abhi Dedania">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playlists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200..700&display=swap"></noscript>
<style>
:root{--edge:rgba(255,255,255,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#05090c;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* full-screen backgrounds (two layers so they crossfade) */
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .9s ease;will-change:opacity}
.bg.on{opacity:1}
.bg:not(.on){transition-delay:.9s}  /* old image stays until the new one has fully faded in */

/* top tabs: glass pill, white text, thin when idle and bold when selected */
.tabs{position:fixed;top:max(22px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);display:flex;gap:2px;padding:6px;border-radius:999px;background:rgba(20,30,70,.28);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--edge);box-shadow:0 8px 30px rgba(0,0,30,.25),inset 0 1px 0 rgba(255,255,255,.22);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:#000;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:left .35s cubic-bezier(.3,.9,.3,1),width .35s cubic-bezier(.3,.9,.3,1)}
.tab{position:relative;z-index:1;flex:none;display:inline-flex;flex-direction:column;align-items:center;background:none;border:0;color:rgba(255,255,255,.8);font-family:inherit;font-size:15px;line-height:1;font-weight:300;padding:12px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .25s}
.tab::after{content:attr(data-t);font-weight:700;height:0;visibility:hidden;overflow:hidden}  /* reserves the bold width so tabs don't shift */
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;font-weight:700}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* glass player, built to the reference (449 x 265 card) */
.dock{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(449px,calc(100vw - 24px))}
.player{position:relative;padding:38px 33px 43px;border-radius:32px;text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 18px 50px rgba(0,10,60,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.player::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1) 40%,rgba(150,235,255,.75) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#title{margin:0;font-size:24px;line-height:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{margin:6px 0 0;font-size:16px;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{display:block;width:100%;height:22px;margin:21px 0 0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#7fe3d6,#d4e57c var(--p,0%),#dcdcdc var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(190,215,235,.65));border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,20,80,.35)}
#seek::-moz-range-track{height:6px;border-radius:3px;background:#dcdcdc}
#seek::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(to right,#7fe3d6,#d4e57c)}
#seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:rgba(210,228,240,.85);border:2px solid rgba(255,255,255,.9)}
#seek:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:12px;line-height:14px;font-weight:500}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.ib{background:none;border:0;color:#fff;padding:0;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;transition:filter .2s,transform .15s}
.ib:active{transform:scale(.92)}
.ib:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.ib svg{width:28px;height:28px}
.ib .f{fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.ib .o{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.tog[aria-pressed=true]{filter:drop-shadow(0 0 6px rgba(255,255,255,.85))}
.ib.play{position:relative;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.07) 65%,rgba(255,255,255,.14));box-shadow:0 10px 24px rgba(0,10,40,.32),inset 2px 3px 5px rgba(255,255,255,.45),inset -3px -4px 8px rgba(255,255,255,.08)}
.ib.play::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(90% 70% at 30% 8%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%);pointer-events:none}
.ib.play:hover{background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(255,255,255,.1) 65%,rgba(255,255,255,.18))}
.ib.play svg{position:relative}
.ib.play svg{width:28px;height:28px}
#msg{position:absolute;z-index:2;left:50%;bottom:calc(100% + 14px);width:max-content;max-width:calc(100vw - 24px);transform:translate(-50%,56px);font-size:14px;line-height:1.35;padding:11px 18px;border-radius:16px;text-align:center;background:rgba(20,30,40,.55);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .4s cubic-bezier(.2,.9,.3,1)}
#msg.show{opacity:1;transform:translate(-50%,0)}
#yt{position:fixed;right:0;bottom:0;width:240px;height:135px;z-index:-1;pointer-events:none}  /* hidden behind the background; YouTube needs a real-sized player to play */
/* credit */
.credit{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0;font-size:12px;line-height:14px;font-weight:300;letter-spacing:.02em;color:rgba(255,255,255,.75);text-shadow:0 1px 8px rgba(0,0,0,.65);white-space:nowrap}
.credit a{color:#fff;font-weight:600;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);transition:border-color .2s}
.credit a:hover{border-color:#fff}
.credit a:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:3px}
/* playlist button + panel (same glass theme as the player) */
#title,#sub{padding:0 26px}
.ib.pb{position:absolute;top:12px;right:12px}
.ib.pb[aria-expanded=true]{filter:drop-shadow(0 0 6px rgba(255,255,255,.85))}
.plist{position:absolute;left:0;right:0;bottom:calc(100% + 14px);overflow:hidden;padding:14px 6px;border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.3);box-shadow:0 18px 50px rgba(0,10,60,.28),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(36px);visibility:hidden;pointer-events:none;transition:transform .4s cubic-bezier(.2,.9,.3,1),visibility 0s linear .4s}
.plist.open{transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
.pls{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable both-edges;padding:0 4px}
.pls::-webkit-scrollbar{width:6px}
.pls::-webkit-scrollbar-track{background:transparent}
.pls::-webkit-scrollbar-thumb{background:rgba(255,255,255,.4);border-radius:3px}
.pls::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.65)}
.pls::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){.pls{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent}}
.plist .empty{margin:14px 10px;text-align:center;font-size:14px;color:rgba(255,255,255,.8)}
.song{margin:0 0 8px;border-radius:30px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.14);transition:background .25s,border-color .25s}
.song:last-child{margin-bottom:0}
.song:hover,.song.open{background:rgba(255,255,255,.18)}
.song.now{border-color:rgba(255,255,255,.6)}
.head{display:flex;align-items:center;gap:12px;width:100%;padding:8px 18px 8px 8px;background:none;border:0;border-radius:inherit;color:#fff;font:600 15px/1.25 Inter,-apple-system,sans-serif;text-align:left;cursor:pointer}
.head:focus-visible,.act:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.th{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:rgba(255,255,255,.18)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song.open .nm{white-space:normal}
.eq{display:none;align-items:flex-end;gap:2px;height:14px;flex:none}
.eq b{width:3px;height:6px;background:#fff;border-radius:2px}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
.song.now .eq{display:flex}
.plist.on .song.now .eq b{animation:eqb 1s ease-in-out infinite}
@keyframes eqb{0%,100%{height:4px}50%{height:14px}}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.9,.3,1)}
.song.open .more{grid-template-rows:1fr}
.mi{overflow:hidden;min-height:0}
.song:not(.open) .mx{visibility:hidden}
.mx{padding:4px 12px 14px}
.big{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;background:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,10,40,.3)}
.mx dl{margin:14px 4px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;line-height:1.35}
.mx dt{color:rgba(255,255,255,.7);font-weight:300}.mx dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 4px 0}
.act{display:inline-flex;align-items:center;padding:9px 16px;border:0;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);color:#fff;font:600 14px/1 Inter,-apple-system,sans-serif;text-decoration:none;cursor:pointer}
.act:hover{background:rgba(255,255,255,.28)}
@media(max-width:600px){   /* phones: smaller, tighter player */
  .dock{width:min(340px,calc(100vw - 32px))}
  .credit{font-size:11px}
  .player{padding:20px 20px 22px;border-radius:26px}
  #title{font-size:18px;line-height:24px}
  #sub{font-size:13px;line-height:18px;margin-top:3px}
  #seek{height:28px;margin:10px 0 0}
  .times{font-size:11px;line-height:12px;margin-top:-2px}
  .ctl{margin-top:6px}
  .ib{width:34px;height:34px}.ib svg{width:22px;height:22px}
  .ib.play{width:50px;height:50px}.ib.play svg{width:24px;height:24px}
  .tab{padding:10px 15px;font-size:14px}
  #msg{font-size:13px;padding:9px 14px}
  .ib.pb{top:8px;right:8px}
  #title,#sub{padding:0 22px}
  .plist{padding:12px 4px;border-radius:26px}
  .song{border-radius:26px}.head{padding:7px 14px 7px 7px;font-size:14px}.th{width:34px;height:34px}
  .mx dl{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<img class="bg" id="bgA" alt=""><img class="bg" id="bgB" alt="">

<nav class="tabs" id="tabs" role="tablist" aria-label="Playlists"><span class="pill" id="pill"></span></nav>

<div class="dock">
<div class="plist" id="plist" role="region" aria-label="Playlist"><div class="pls" id="pls"></div></div>
<div id="msg" role="status"></div>
<section class="player" aria-label="Music player">
  <button class="ib pb" id="pbtn" type="button" aria-label="Playlist" aria-expanded="false" aria-controls="plist"><svg viewBox="0 0 24 24"><path class="o" d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
  <h2 id="title">Song Name</h2>
  <p id="sub">Singer Name - Album Name</p>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="ib tog" id="shuf" aria-pressed="false" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path class="o" d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path class="f" d="M11 7v10l-7.5-5zM20.5 7v10L13 12z"/></svg></button>
    <button class="ib play" id="play" aria-label="Play"></button>
    <button class="ib" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path class="f" d="M13 7v10l7.5-5zM3.5 7v10L11 12z"/></svg></button>
    <button class="ib tog" id="rep" aria-pressed="true" aria-label="Repeat playlist"><svg viewBox="0 0 24 24"><path class="o" d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
</section>
</div>
<p class="credit">Made by <a href="https://dribbble.com/abhidedania" target="_blank" rel="noopener noreferrer">Abhi Dedania</a></p>
<div id="yt"></div>

<script>
/* ===== EDIT HERE =====
   bg: background image for the tab (path or URL). Every tab uses the same image for now (swap BG for any image path or URL).
   tracks: { t: song title, a: singer, al: album (optional), yt: YouTube video ID (the part after v=) }
   playlist: use instead of tracks to play a whole YouTube playlist (the list= part of the playlist link).
   Leave t, a and al empty and they are filled in automatically when the song plays
   (title and channel from YouTube, album looked up from the song title). Fill them in yourself to override. */
const BG='embedded';   /* the forest photo stored at the very bottom of this file; or put any image path/URL here */
const GENRES = [
  {name:'Indie Pop',        bg:BG, playlist:'PL1gfuz7ZYcaM2Z7sCGOWORCF0CGmonzOv', tracks:[]},
  {name:'Lock The Fuck In', bg:BG, tracks:[{t:'',a:'',al:'',yt:''}]},
  {name:'Old Is Gold',      bg:BG, playlist:'PLafSq5UblCNWzrBiEOwBeIdoU8AFXfTqp', tracks:[]},
  {name:'3am',             bg:BG, tracks:[{t:'',a:'',al:'',yt:''}]},
  {name:'Aura',            bg:BG, tracks:[{t:'',a:'',al:'',yt:''}]},
  {name:'Mood Fresh',      bg:BG, playlist:'PLoD5PdhRFdJNl06_Sv8CGiX5dprLp14P6', tracks:[]}
];
/* ===================== */
const $=s=>document.querySelector(s);
const plist=$('#plist'),pls=$('#pls');
const ICON={play:'<svg viewBox="0 0 24 24"><path class="f" d="M8 5.5v13l11-6.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path class="f" d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z"/></svg>'};
let gi=0, ti=0, yt, ready=false, st=-1, want=false, fails=0, shuffle=false, repeat=true, layer=0, order=[], plTrack=null, flags=false, armed=false, cued=null;
const PL={}, isPL=()=>!!GENRES[gi].playlist, curT=()=>isPL()?(plTrack||{t:'',a:'',al:''}):GENRES[gi].tracks[order[ti]];
const fmt=t=>isFinite(t)&&t>0?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const toast=(m,ms=3500)=>{const e=$('#msg');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)};
const ERR={2:'That YouTube link is invalid.',5:'Your browser could not play this video.',100:'This video was removed or is private.',101:'The owner of this video blocks playback outside YouTube.',150:'The owner of this video blocks playback outside YouTube.',153:'YouTube blocked playback because the page has no web address. Open the site through a server (see README), not by double-clicking the file.'};
$('#play').innerHTML=ICON.play;
function paintPlay(force){plist.classList.toggle('on',force||st===1);const b=force||st===1||(want&&(st===3||st===5));$('#play').innerHTML=b?ICON.pause:ICON.play;$('#play').setAttribute('aria-label',b?'Pause':'Play')}

/* tabs */
const tabs=$('#tabs');
GENRES.forEach((g,i)=>{
  const b=document.createElement('button');
  b.className='tab';b.setAttribute('role','tab');b.textContent=g.name;b.dataset.t=g.name;
  b.onclick=()=>{if(i===gi)return;choose(i,armed)};   /* armed = the user has pressed play at least once */
  tabs.appendChild(b);
});
function movePill(){
  const b=tabs.querySelectorAll('.tab')[gi],p=$('#pill');
  p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px';
  tabs.scrollTo({left:b.offsetLeft-(tabs.clientWidth-b.offsetWidth)/2,behavior:'smooth'});
}
function paintTabs(){tabs.querySelectorAll('.tab').forEach((b,i)=>b.setAttribute('aria-selected',i===gi));movePill()}
window.addEventListener('resize',movePill);

/* background crossfade */
let EMBED='',bgWanted='';   /* EMBED is filled in by the last <script> of the page, once everything else is already running */
window.__embed=u=>{EMBED=u;if(bgWanted==='embedded')setBg('embedded')};
function setBg(key){
  const url=key==='embedded'?EMBED:key;
  if(!url){bgWanted=key;return}
  bgWanted='';
  const L=[$('#bgA'),$('#bgB')];
  if(L[layer].classList.contains('on')&&L[layer].getAttribute('src')===url)return;
  layer^=1;
  L[layer].src=url;L[layer].classList.add('on');L[layer^1].classList.remove('on');
}

/* playback */
function buildOrder(){
  const n=(GENRES[gi].tracks||[]).length;order=[...Array(n).keys()];
  if(shuffle)for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
}
function info(){
  const s=curT();
  $('#title').textContent=s.t||(want?'Loading…':'Not playing');
  $('#sub').textContent=[s.a,s.al].filter(Boolean).join(' - ')||(want?'':'Press play');
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.t||'',artist:s.a||'',album:s.al||''});
}
function playTrack(){
  armed=true;   /* from now on, switching tabs starts the new tab's music by itself */
  want=true;plTrack=null;info();
  $('#cur').textContent=$('#dur').textContent='0:00';$('#seek').value=0;$('#seek').style.setProperty('--p','0%');
  const g=GENRES[gi];
  if(g.playlist){
    if(!ready){toast('Player is loading, it will start in a moment');return}
    flags=true;
    if(cued===g.playlist&&st===5){cued=null;yt.playVideo();paintPlay(true);return}   /* already loaded in the background: starts instantly */
    cued=null;try{yt.stopVideo()}catch(e){}   /* silence the old playlist right away so nothing stale plays or reports */
    yt.loadPlaylist({list:g.playlist,listType:'playlist',index:0});paintPlay(true);return;
  }
  const s=g.tracks[order[ti]];
  if(!s.yt){want=false;info();paintPlay();if(ready)yt.stopVideo();toast('No song added to this tab yet');return}
  if(!ready){toast('Player is loading, it will start in a moment');return}   /* want stays true: starts as soon as the player is ready */
  if(cued===s.yt&&st===5){cued=null;yt.playVideo();paintPlay(true);return}
  cued=null;yt.loadVideoById(s.yt);paintPlay(true);
}
function precue(){   /* load (not play) the selected tab's music in the background so the first Play is instant */
  cued=null;if(!ready||want)return;const g=GENRES[gi];
  if(g.playlist){cued=g.playlist;yt.cuePlaylist({listType:'playlist',list:g.playlist})}
  else{const s=g.tracks[order[ti]];if(s&&s.yt){cued=s.yt;yt.cueVideoById(s.yt)}}
}
function choose(i,autoplay){
  gi=i;ti=0;fails=0;buildOrder();paintTabs();setBg(GENRES[i].bg);plTrack=null;nowId='';info();drawPanel();
  if(autoplay)playTrack();else{if(ready&&st>0){want=false;yt.stopVideo()}precue()}
}
function next(){
  if(isPL()){if(ready&&[1,2,3].includes(st)){want=true;yt.nextVideo()}else playTrack();return}
  if(ti+1>=order.length){if(!repeat){want=false;if(ready)yt.pauseVideo();return}buildOrder();ti=0}else ti++;
  playTrack();
}
function prev(){
  if(isPL()){if(ready&&[1,2,3].includes(st)){if(yt.getCurrentTime()>3)yt.seekTo(0);else{want=true;yt.previousVideo()}}else playTrack();return}
  if(ready&&yt.getCurrentTime()>3){yt.seekTo(0);return}
  ti=(ti-1+order.length)%order.length;playTrack();
}
function toggle(){
  if(!ready){playTrack();return}

/* song details: YouTube gives title + channel; album, year, genre and length are looked up from the title (iTunes search, no key needed) */
const norm=x=>(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const tidy=x=>(x||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'').replace(/\b(official|lyrics?|audio|video|hd|4k)\b/gi,'').replace(/\s+/g,' ').replace(/[\s\-|]+$/,'').trim();

function setRaw(s,title,author){

  let song=tidy(title),who=clean(author);const m=song.match(/^(.+?)\s+[-–]\s+(.+)$/);if(m){who=m[1];song=m[2]}
  s.rawSong=song;s.rawWho=who;s.chan=clean(author);

}
async function album(s){
  if(s.meta||!s.rawSong)return;s.meta=1;touch(s);
  try{
    {   /* always look up: typed details are never overwritten, but year, genre and length still get filled in */
      const r=await fetch('https://itunes.apple.com/search?entity=song&limit=5&term='+encodeURIComponent(s.rawSong+' '+s.rawWho));
      const hit=(await r.json()).results.find(x=>{const n=norm(x.trackName);return n&&(norm(s.rawSong).includes(n)||n.includes(norm(s.rawSong)))});
      if(hit){
        if(!s.own.t)s.t=hit.trackName;if(!s.own.a)s.a=hit.artistName;if(!s.own.al)s.al=hit.collectionName.replace(/\s+-\s+(Single|EP)$/i,'');
        s.yr=(hit.releaseDate||'').slice(0,4);s.genre=hit.primaryGenreName||'';s.len=hit.trackTimeMillis?fmt(hit.trackTimeMillis/1000):'';
      }
    }
  }catch(e){}

}
async function fillMeta(s,vd){setRaw(s,vd.title,vd.author);const show=()=>{if(curT()===s)info()};show();await album(s);show()}

async function oembed(id){   /* title + channel of any YouTube video */
  const u=encodeURIComponent('https://www.youtube.com/watch?v='+id);
  for(const b of ['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url=']){

}
function paintRow(id){
  const r=rows.get(id);if(!r)return;const s=songObj(id);
  r.nm.textContent=s.t||(s.rd?'YouTube video':'Loading…');
  const e=[['Singer',s.a||'—'],['Album',s.al||(s.md?'—':'Looking up…')]];
  if(s.yr)e.push(['Released',s.yr]);if(s.genre)e.push(['Genre',s.genre]);if(s.len)e.push(['Length',s.len]);
  if(s.chan&&norm(s.chan)!==norm(s.a))e.push(['Channel',s.chan]);
  r.dl.replaceChildren(...e.flatMap(([k,v])=>{const a=document.createElement('dt'),b=document.createElement('dd');a.textContent=k;b.textContent=v;return [a,b]}));   /* textContent only: titles are untrusted text */
}
function closeRow(id){const r=rows.get(id);if(!r)return;r.el.classList.remove('open');r.head.setAttribute('aria-expanded','false')}
function openRow(id){
  rows.forEach((r,k)=>{if(k!==id)closeRow(k)});

  r.el.classList.add('open');r.head.setAttribute('aria-expanded','true');

}
function buildRow(id){
  const el=document.createElement('div');el.className='song';el.dataset.id=id;
  const head=document.createElement('button');head.className='head';head.type='button';head.setAttribute('aria-expanded','false');
  const th=new Image();th.className='th';th.alt='';th.loading='lazy';th.src=thumb(id,'mqdefault');
  const nm=document.createElement('span');nm.className='nm';
  const eq=document.createElement('span');eq.className='eq';eq.innerHTML='<b></b><b></b><b></b>';
  head.append(th,nm,eq);
  const big=new Image();big.className='big';big.alt='';
  const dl=document.createElement('dl'),acts=document.createElement('div');acts.className='acts';
  const pl=document.createElement('button');pl.className='act';pl.type='button';pl.textContent='▶ Play';
  const yl=document.createElement('a');yl.className='act';yl.href='https://www.youtube.com/watch?v='+id;yl.target='_blank';yl.rel='noopener noreferrer';yl.textContent='Watch on YouTube ↗';

  const mi=document.createElement('div');mi.className='mi';mi.append(mx);
  const more=document.createElement('div');more.className='more';more.append(mi);

function drawPanel(){
