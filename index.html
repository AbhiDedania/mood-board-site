<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playlists</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--edge:rgba(255,255,255,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#05090c;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* full-screen backgrounds (two layers so they crossfade) */
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .9s ease}
.bg.on{opacity:1}
.bg:not(.on){transition-delay:.9s}  /* old image stays until the new one has fully faded in */

/* top tabs: glass pill, white text, thin when idle and bold when selected */
.tabs{position:fixed;top:max(22px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);display:flex;gap:2px;padding:6px;border-radius:999px;background:rgba(20,30,70,.28);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--edge);box-shadow:0 8px 30px rgba(0,0,30,.25),inset 0 1px 0 rgba(255,255,255,.22);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:#000;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:left .35s cubic-bezier(.3,.9,.3,1),width .35s cubic-bezier(.3,.9,.3,1)}
.tab{position:relative;z-index:1;flex:none;display:inline-flex;flex-direction:column;align-items:center;background:none;border:0;color:rgba(255,255,255,.8);font-family:inherit;font-size:15px;line-height:1;font-weight:300;padding:12px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .25s}
.tab::after{content:attr(data-t);font-weight:700;height:0;visibility:hidden;overflow:hidden}  /* reserves the bold width so tabs don't shift */
.tab:hover{color:#fff}
.tab[aria-selected=true]{color:#fff;font-weight:700}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* glass player, built to the reference (449 x 265 card) */
.dock{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(449px,calc(100vw - 24px))}
.player{position:relative;padding:38px 33px 43px;border-radius:32px;text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 18px 50px rgba(0,10,60,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.player::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1) 40%,rgba(150,235,255,.75) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#title{margin:0;font-size:24px;line-height:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{margin:6px 0 0;font-size:16px;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{display:block;width:100%;height:22px;margin:21px 0 0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#7fe3d6,#d4e57c var(--p,0%),#dcdcdc var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(190,215,235,.65));border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,20,80,.35)}
#seek::-moz-range-track{height:6px;border-radius:3px;background:#dcdcdc}
#seek::-moz-range-progress{height:6px;border-radius:3px;background:linear-gradient(to right,#7fe3d6,#d4e57c)}
#seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:rgba(210,228,240,.85);border:2px solid rgba(255,255,255,.9)}
#seek:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
.times{display:flex;justify-content:space-between;font-size:12px;line-height:14px;font-weight:500}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.ib{background:none;border:0;color:#fff;padding:0;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;transition:filter .2s,transform .15s}
.ib:active{transform:scale(.92)}
.ib:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:8px}
.ib svg{width:28px;height:28px}
.ib .f{fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.ib .o{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.tog[aria-pressed=true]{filter:drop-shadow(0 0 6px rgba(255,255,255,.85))}
.ib.play{position:relative;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.07) 65%,rgba(255,255,255,.14));backdrop-filter:blur(14px) saturate(190%);-webkit-backdrop-filter:blur(14px) saturate(190%);box-shadow:0 10px 24px rgba(0,10,40,.32),inset 2px 3px 5px rgba(255,255,255,.45),inset -3px -4px 8px rgba(255,255,255,.08)}
.ib.play::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(90% 70% at 30% 8%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%);pointer-events:none}
.ib.play:hover{background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(255,255,255,.1) 65%,rgba(255,255,255,.18))}
.ib.play svg{position:relative}
.ib.play svg{width:28px;height:28px}
#msg{position:absolute;z-index:2;left:50%;bottom:calc(100% + 14px);width:max-content;max-width:calc(100vw - 24px);transform:translate(-50%,56px);font-size:14px;line-height:1.35;padding:11px 18px;border-radius:16px;text-align:center;background:rgba(20,30,40,.55);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .4s cubic-bezier(.2,.9,.3,1)}
#msg.show{opacity:1;transform:translate(-50%,0)}
#yt{position:fixed;right:0;bottom:0;width:240px;height:135px;z-index:-1;pointer-events:none}  /* hidden behind the background; YouTube needs a real-sized player to play */
@media(max-width:420px){.player{padding:32px 22px 34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<img class="bg" id="bgA" alt=""><img class="bg" id="bgB" alt="">

<nav class="tabs" id="tabs" role="tablist" aria-label="Playlists"><span class="pill" id="pill"></span></nav>

<div class="dock">
<div id="msg" role="status"></div>
<section class="player" aria-label="Music player">
  <h2 id="title">Song Name</h2>
  <p id="sub">Singer Name - Album Name</p>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="ib tog" id="shuf" aria-pressed="false" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path class="o" d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path class="f" d="M11 7v10l-7.5-5zM20.5 7v10L13 12z"/></svg></button>
    <button class="ib play" id="play" aria-label="Play"></button>
    <button class="ib" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path class="f" d="M13 7v10l7.5-5zM3.5 7v10L11 12z"/></svg></button>
    <button class="ib tog" id="rep" aria-pressed="true" aria-label="Repeat playlist"><svg viewBox="0 0 24 24"><path class="o" d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
</section>
</div>
<div id="yt"></div>

function playTrack(){
  want=true;plTrack=null;info();
  $('#cur').textContent=$('#dur').textContent='0:00';$('#seek').value=0;$('#seek').style.setProperty('--p','0%');
  const g=GENRES[gi];
  if(g.playlist){
    if(!ready){toast('Player is loading, it will start in a moment');return}
    flags=true;yt.loadPlaylist({list:g.playlist,listType:'playlist',index:0});return;
  }
  const s=g.tracks[order[ti]];
  if(!s.yt){want=false;info();if(ready)yt.stopVideo();toast('No song added to this tab yet');return}
  if(!ready){toast('Player is loading, it will start in a moment');return}   /* want stays true: starts as soon as the player is ready */
  yt.loadVideoById(s.yt);
}
function choose(i,autoplay){
  gi=i;ti=0;fails=0;buildOrder();paintTabs();setBg(GENRES[i].bg);plTrack=null;info();
  if(autoplay)playTrack();else if(ready&&st>0){yt.stopVideo()}
}
function next(){
  if(isPL()){if(ready&&[1,2,3].includes(st)){want=true;yt.nextVideo()}else playTrack();return}
  if(ti+1>=order.length){if(!repeat){want=false;if(ready)yt.pauseVideo();return}buildOrder();ti=0}else ti++;
  playTrack();
}
function prev(){
  if(isPL()){if(ready&&[1,2,3].includes(st)){if(yt.getCurrentTime()>3)yt.seekTo(0);else{want=true;yt.previousVideo()}}else playTrack();return}
  if(ready&&yt.getCurrentTime()>3){yt.seekTo(0);return}
  ti=(ti-1+order.length)%order.length;playTrack();
}
function toggle(){
  if(!ready){playTrack();return}
  if(st===1||st===3){want=false;yt.pauseVideo()}
  else if(st===2){want=true;yt.playVideo()}
  else playTrack();
}
$('#play').onclick=toggle;$('#next').onclick=next;$('#prev').onclick=prev;
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);if(isPL()){if(ready)yt.setShuffle(shuffle);return}const cur=order[ti];buildOrder();ti=order.indexOf(cur)};
$('#rep').onclick=e=>{repeat=!repeat;e.currentTarget.setAttribute('aria-pressed',repeat);if(isPL()&&ready)yt.setLoop(repeat)};
$('#seek').oninput=e=>{if(ready&&st>=0){const d=yt.getDuration();if(d)yt.seekTo(d*e.target.value/1000,true)}};

/* song details: YouTube gives title + channel; the album is looked up from the title (iTunes search, no key needed) */
const norm=x=>(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const tidy=x=>(x||'').replace(/\s*[\(\[][^\)\]]*[\)\]]/g,'').replace(/\b(official|lyrics?|audio|video|hd|4k)\b/gi,'').replace(/\s+/g,' ').replace(/[\s\-|]+$/,'').trim();
async function fillMeta(s,vd){
  if(s.meta)return;s.meta=1;
  const own={t:!!s.t,a:!!s.a,al:!!s.al}, show=()=>{if(curT()===s)info()};
  let song=tidy(vd.title),who=(vd.author||'').replace(/\s*-\s*Topic$|VEVO$/i,'').trim();
  const m=song.match(/^(.+?)\s+[-–]\s+(.+)$/); if(m){who=m[1];song=m[2]}
  if(!own.t)s.t=song; if(!own.a)s.a=who; show();
  if(own.t&&own.a&&own.al)return;
  try{
    const r=await fetch('https://itunes.apple.com/search?entity=song&limit=5&term='+encodeURIComponent(song+' '+who));
    const hit=(await r.json()).results.find(x=>{const n=norm(x.trackName);return n&&(norm(song).includes(n)||n.includes(norm(song)))});
    if(hit){if(!own.t)s.t=hit.trackName;if(!own.a)s.a=hit.artistName;if(!own.al)s.al=hit.collectionName.replace(/\s+-\s+(Single|EP)$/i,'')}
  }catch(e){}
  show();
}

/* YouTube (audio from a hidden embed) */
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
tag.onerror=()=>toast('Couldn’t reach YouTube. Check your connection or ad-blocker.',8000);
setTimeout(()=>{if(!ready&&want)toast('The YouTube player isn’t loading here. Open the site from localhost or a web host.',9000)},8000);
window.onYouTubeIframeAPIReady=()=>{
  yt=new YT.Player('yt',{height:'2',width:'2',playerVars:Object.assign({playsinline:1,controls:0},/^https?:/.test(location.protocol)?{origin:location.origin}:{}),events:{
    onReady:()=>{ready=true;if(want)playTrack()},
    onStateChange:e=>{
      st=e.data;const p=st===1;
      $('#play').innerHTML=p?ICON.pause:ICON.play;$('#play').setAttribute('aria-label',p?'Pause':'Play');
      if(p){
        fails=0;
        const vd=yt.getVideoData();
        if(isPL()){
          if(flags){flags=false;yt.setLoop(repeat);if(shuffle)yt.setShuffle(true)}
          const k=vd&&vd.video_id;if(k){PL[k]=PL[k]||{t:'',a:'',al:''};if(plTrack!==PL[k]){plTrack=PL[k];info()}}
        }
        const s=curT();if(vd&&s)fillMeta(s,vd);
      }
      if(st===0&&want){   /* song ended: continue until the user stops it */
        if(isPL()){const l=yt.getPlaylist()||[];if(!repeat&&l.length&&yt.getPlaylistIndex()===l.length-1)want=false}   /* YouTube moves on / loops by itself */
        else next();
      }
      if('mediaSession' in navigator)navigator.mediaSession.playbackState=p?'playing':'paused';
    },
    onError:e=>{
      fails++;const why=ERR[e&&e.data]||'This song can’t be played here.';
      const total=isPL()?((yt.getPlaylist()||[]).length||1):GENRES[gi].tracks.length;
      if(fails>=total){want=false;toast(why,7000)}
      else{toast(why+' Skipping to the next song.',4000);isPL()?yt.nextVideo():next()}
    }
  }});
};
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',toggle);m.setActionHandler('pause',toggle);m.setActionHandler('nexttrack',next);m.setActionHandler('previoustrack',prev)}
setInterval(()=>{
  if(!ready||st<0)return;
  const d=yt.getDuration(),c=yt.getCurrentTime();
  if(d){const s=$('#seek');s.value=c/d*1000;s.style.setProperty('--p',c/d*100+'%');$('#cur').textContent=fmt(c);$('#dur').textContent=fmt(d)}
},500);

if(location.protocol==='file:')toast('Open this site through a server, not by double-clicking the file. YouTube blocks playback from file://. See README.',12000);
choose(0,false);
document.fonts&&document.fonts.ready.then(movePill);
</script>
